<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>мем</title>
<style>
:root{--bg:#0a0c10;--fg:#e7e9ee;--mut:#8a92a0;--acc:#6ee7b7;--warn:#f0a35e;--line:#1c2129;--card:#12161c;}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--fg);
font:15px/1.5 -apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;user-select:none;-webkit-user-select:none}
.wrap{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:28px 20px 40px;text-align:center}
.kicker{font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--mut)}
.rule{color:var(--mut);font-size:14px;max-width:42ch}
.card{width:min(88vw,420px);background:var(--card);border:1px solid var(--line);border-radius:12px;
padding:24px 20px;text-align:center;min-height:280px;display:flex;flex-direction:column;justify-content:center;gap:14px}
.fmt{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--mut);margin-top:6px}
.cap{font-weight:700;font-size:17px;line-height:1.35;text-shadow:0 1px 2px rgba(0,0,0,.6)}
.row{display:flex;align-items:center;gap:12px;text-align:left}
.row .em{font-size:34px;flex:0 0 auto}
.row .tx{font-weight:700;font-size:15px;line-height:1.3}
.rej{opacity:.55;text-decoration:line-through}
.acc{color:var(--acc)}
.fire{background:radial-gradient(ellipse at 50% 120%, #3a1408 0%, #1a0d06 55%, var(--card) 100%)}
.fire .cap{color:#ffd9a0}
.chaos{font-size:11px;color:var(--mut);letter-spacing:.04em;margin-top:2px}
.big{font-size:56px;line-height:1}
.galaxy .row{gap:10px}
.galaxy .r1 .em{font-size:22px}
.galaxy .r2 .em{font-size:30px}
.galaxy .r3 .em{font-size:40px;filter:drop-shadow(0 0 8px var(--acc))}
.galaxy .r3 .tx{color:var(--acc)}
.yell{color:var(--warn);font-weight:800;letter-spacing:.05em;text-transform:uppercase;font-size:16px}
.purr{color:var(--mut);font-size:15px}
button#go{background:var(--acc);color:#04120c;border:none;font-weight:600;
padding:12px 28px;border-radius:6px;cursor:pointer;font-size:16px}
button#go:active{transform:translateY(1px)}
.foot{margin-top:8px;font-size:12px;color:var(--mut)}
.foot a{color:var(--acc);text-decoration:none}
</style>
</head>
<body>
<div class="wrap">
  <div class="kicker">генератор мемов</div>
  <div class="card" id="card"></div>
  <div class="fmt" id="fmt"></div>
  <button id="go">сгенерировать</button>
  <div class="rule">без повторов, пока не кончится колода. пробел — тоже работает.</div>
  <div class="foot">сделал <a href="../">Tally</a></div>
</div>
<script>
const DECK=[
 {f:'drake',top:'один и тот же пароль',bottom:'один и тот же пароль, но с «1» в конце'},
 {f:'drake',top:'спать до 9',bottom:'спать до 9, но будильник в 8:50'},
 {f:'drake',top:'сделать всё сегодня',bottom:'сделать всё сегодня, но начать в 4 утра'},
 {f:'fine',calm:'всё нормально',chaos:'комната горит · сервер упал · дедлайн через 5 минут'},
 {f:'fine',calm:'я в порядке',chaos:'кофе пролит · кот в огне · 14 непрочитанных'},
 {f:'fine',calm:'спокойно',chaos:'продакшн горит · тесты красные · пятница'},
 {f:'success',t:'наконец-то заделал крышку от унитаза'},
 {f:'success',t:'написал коммит «fix»'},
 {f:'success',t:'наконец-то закрываю 12 вкладок'},
 {f:'chad',t:'когда дедлайн завтра, а ты уже всё сделал'},
 {f:'chad',t:'когда тесты зелёные, а ты не веришь'},
 {f:'chad',t:'когда написал «готово» — и реально готово'},
 {f:'cmm',t:'я могу объяснить, почему 4 утра — лучшее время для кода'},
 {f:'cmm',t:'я уверен, что «fix» — валидный коммит-мессидж'},
 {f:'cmm',t:'я настаиваю, что пятница — рабочий день'},
 {f:'galaxy',a:'делать задачи',b:'делать задачи по порядку',c:'делать задачи, зная, что не всё успеешь'},
 {f:'galaxy',a:'пить кофе',b:'пить кофе днём',c:'пить кофе, зная, что встанешь в 7'},
 {f:'galaxy',a:'писать код',b:'писать код с комментариями',c:'писать код, зная, что завтра его будут чужие'},
 {f:'cat',yell:'почему опять',purr:'мяу'},
 {f:'cat',yell:'дедлайн через 5 минут',purr:'мурр'},
 {f:'cat',yell:'кого это не заботит',purr:'мяу (не меня)'}
];
const NAMES={drake:'Дрейк рассматривает варианты',fine:'This is fine',success:'Успешный мальчик',
chad:'Гигачад',cmm:'Change my mind',galaxy:'Galaxy brain',cat:'Девушка кричит на кошку'};
function render(m){
  const c=document.getElementById('card');
  document.getElementById('fmt').textContent=NAMES[m.f];
  let h='';
  if(m.f==='drake'){
    h='<div class="row"><span class="em">🙅</span><span class="tx rej">'+m.top+'</span></div>'+
      '<div class="row"><span class="em">👉</span><span class="tx acc">'+m.bottom+'</span></div>';
  } else if(m.f==='fine'){
    c.classList.add('fire');
    h='<div class="big">🐶</div><div class="cap">'+m.calm+'</div><div class="chaos">'+m.chaos+'</div>';
  } else if(m.f==='success'){
    h='<div class="big">💪</div><div class="cap">'+m.t+'</div>';
  } else if(m.f==='chad'){
    h='<div class="big">😤</div><div class="cap">'+m.t+'</div>';
  } else if(m.f==='cmm'){
    h='<div class="big">😌</div><div class="big" style="font-size:34px">🪑</div><div class="cap">'+m.t+'</div>';
  } else if(m.f==='galaxy'){
    h='<div class="galaxy" style="display:flex;flex-direction:column;gap:10px">'+
      '<div class="row r1"><span class="em">🧠</span><span class="tx">'+m.a+'</span></div>'+
      '<div class="row r2"><span class="em">🧠</span><span class="tx">'+m.b+'</span></div>'+
      '<div class="row r3"><span class="em">🧠</span><span class="tx">'+m.c+'</span></div></div>';
  } else if(m.f==='cat'){
    h='<div class="yell">'+m.yell+'</div><div class="row"><span class="em">🐱</span><span class="purr">'+m.purr+'</span></div>';
  }
  c.innerHTML=h;
}
let bag=[];
function draw(){
  if(bag.length===0) bag=DECK.slice().sort(()=>Math.random()-.5);
  const m=bag.pop();
  const c=document.getElementById('card');
  c.classList.remove('fire');
  render(m);
}
document.getElementById('go').onclick=draw;
document.addEventListener('keydown',e=>{
  if((e.code==='Space'||e.code==='Enter') && document.activeElement!==document.getElementById('go')){
    e.preventDefault(); draw();
  }
});
draw();
</script>
</body>
</html>
